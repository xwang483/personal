<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>刊邮离线演示（不是服务器）</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      color: #1e1a16;
      background: #e7dcc8;
    }
    .page { max-width: 40rem; margin: 0 auto; padding: 0.85rem; }
    .banner, .sheet {
      background: #fbf7ef;
      border: 1px solid rgba(70, 48, 24, 0.16);
      padding: 1rem 1.05rem;
    }
    .banner { border-color: #8d2f2a; }
    .banner strong { color: #8d2f2a; }
    .sheet { margin-top: 0.75rem; }
    h1 { margin: 0.35rem 0; font-size: clamp(1.7rem, 7vw, 2.4rem); line-height: 1.15; }
    p { line-height: 1.65; }
    label { display: block; font-weight: 650; margin-bottom: 0.35rem; }
    input, button, a.action {
      font: inherit;
      min-height: 2.75rem;
    }
    input {
      width: 100%;
      border: 1px solid #cbbba3;
      background: #fff;
      padding: 0.55rem 0.7rem;
      font-size: 1rem;
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    .row > * { flex: 1 1 8.5rem; }
    button, a.action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #8d2f2a;
      text-decoration: none;
      cursor: pointer;
      padding: 0.4rem 0.7rem;
    }
    button.primary, a.action { background: #8d2f2a; color: #fbf7ef; }
    button.ghost { background: #fffdf9; color: #1e1a16; }
    .card { border: 1px solid #d9cbb6; background: #fffdf9; padding: 0.85rem; margin-top: 0.7rem; }
    .stamp { display: inline-block; border: 1px solid #8d2f2a; color: #8d2f2a; font-size: 0.75rem; letter-spacing: 0.12em; padding: 0.05rem 0.35rem; }
    .muted { color: #5e564c; font-size: 0.88rem; }
    .error { color: #8d2f2a; }
    .no { font-family: ui-monospace, monospace; word-break: break-all; font-size: 1.02rem; }
  </style>
</head>
<body>
  <main class="page">
    <section class="banner">
      <strong>这是离线演示，不是正在运行的网站。</strong>
      <p>数据写死在这个文件里，全部是虚构示例。没有登录、没有导入、没有数据库。要试真正的查询和导入，请解压源码包后在自己的电脑运行。</p>
    </section>
    <section class="sheet">
      <p class="muted">读者服务 · 离线演示</p>
      <h1>杂志邮寄单号查询</h1>
      <p>试这两个虚构号码：<code>13800001111</code>（韵达和中通）或 <code>13900002222</code>（京东，不能跳转）。空格和 +86 可以留着。</p>
      <form id="form">
        <label for="phone">手机号</label>
        <input id="phone" name="phone" inputmode="tel" autocomplete="tel" maxlength="24" placeholder="请输入完整手机号" />
        <p id="hint" class="muted"></p>
        <div class="row">
          <button class="primary" type="submit">查询单号</button>
        </div>
      </form>
      <div id="out" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const RECORDS = {
      "13800001111": [
        { magazineName: "《刊林》2026年春季号（示例）", date: "2026年3月2日", shippingMethod: "韵达快递", trackingNumber: "DEMO-YD-000001" },
        { magazineName: "《刊林》2025年冬季号（示例）", date: "2026年1月18日", shippingMethod: "中通快递", trackingNumber: "DEMO-ZT-000002" }
      ],
      "13900002222": [
        { magazineName: "《南窗》总第12期（示例）", date: "2026年2月9日", shippingMethod: "京东物流", trackingNumber: "DEMO-JD-000003" }
      ]
    };
    const LINKS = {
      "韵达": "https://web.yundaex.com/Home",
      "韵达快递": "https://web.yundaex.com/Home",
      "韵达速递": "https://web.yundaex.com/Home",
      "yunda": "https://web.yundaex.com/Home",
      "yundaex": "https://web.yundaex.com/Home",
      "中通": "https://www.zto.com/check",
      "中通快递": "https://www.zto.com/check",
      "中通速递": "https://www.zto.com/check",
      "zto": "https://www.zto.com/check"
    };
    const NAMES = { "https://web.yundaex.com/Home": "韵达快递", "https://www.zto.com/check": "中通快递" };

    function normalizePhone(input) {
      let raw = String(input).normalize("NFKC").trim().replace(/^[''\u2018\u2019]+/, "");
      raw = raw.replace(/[\s\u00A0\u3000]+/g, "");
      if (!raw) return null;
      if (/^[+-]?\d+(?:\.\d+)?[eE][+-]?\d+$/.test(raw)) return null;
      if (/^\d+\.0+$/.test(raw)) raw = raw.replace(/\.0+$/, "");
      raw = raw.replace(/[()（）._\-/\\~～]/g, "").replace(/^\+/, "");
      if (raw.startsWith("0086")) raw = raw.slice(4);
      else if (raw.startsWith("86") && raw.length === 13) raw = raw.slice(2);
      return /^1[3-9]\d{9}$/.test(raw) ? raw : null;
    }

    function carrier(method) {
      const key = String(method).normalize("NFKC").trim().toLowerCase().replace(/[\s\u00A0\u3000]+/g, "");
      const href = LINKS[key];
      if (href !== "https://web.yundaex.com/Home" && href !== "https://www.zto.com/check") return null;
      return { href, name: NAMES[href] };
    }

    async function copyText(value) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(value);
          return true;
        }
      } catch (error) {}
      try {
        const area = document.createElement("textarea");
        area.value = value;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.left = "-9999px";
        document.body.appendChild(area);
        area.select();
        const ok = document.execCommand("copy");
        area.remove();
        return ok;
      } catch (error) {
        return false;
      }
    }

    const form = document.getElementById("form");
    const out = document.getElementById("out");
    const hint = document.getElementById("hint");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const phone = normalizePhone(document.getElementById("phone").value);
      out.replaceChildren();
      if (!phone) {
        hint.className = "error";
        hint.textContent = "请输入完整的11位手机号。可以包含空格或 +86，但不能只填一部分。";
        return;
      }
      hint.className = "muted";
      hint.textContent = "";
      const rows = RECORDS[phone] || [];
      if (rows.length === 0) {
        const empty = document.createElement("div");
        empty.className = "card";
        empty.innerHTML = "<h2>没有找到邮寄记录</h2><p>这个离线文件里只有上面两个虚构号码。</p>";
        out.appendChild(empty);
        return;
      }
      const head = document.createElement("p");
      head.textContent = "找到 " + rows.length + " 条虚构记录";
      out.appendChild(head);
      rows.forEach((row) => {
        const card = document.createElement("article");
        card.className = "card";
        const stamp = document.createElement("div");
        stamp.className = "stamp";
        stamp.textContent = "虚构示例";
        const title = document.createElement("h2");
        title.textContent = row.magazineName;
        const meta = document.createElement("p");
        meta.textContent = row.date + " · " + row.shippingMethod;
        const number = document.createElement("p");
        number.className = "no";
        number.textContent = row.trackingNumber;
        const actions = document.createElement("div");
        actions.className = "row";
        const copy = document.createElement("button");
        copy.type = "button";
        copy.className = "ghost";
        copy.textContent = "复制";
        const note = document.createElement("p");
        note.className = "muted";
        const linkInfo = carrier(row.shippingMethod);
        copy.addEventListener("click", async () => {
          const ok = await copyText(row.trackingNumber);
          copy.textContent = ok ? "已复制" : "复制";
          if (!ok) note.textContent = (note.dataset.base || "") + " 没能复制，请长按单号手动复制。";
        });
        actions.appendChild(copy);
        if (linkInfo) {
          const link = document.createElement("a");
          link.className = "action";
          link.href = linkInfo.href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "查询物流";
          note.dataset.base = "打开" + linkInfo.name + "官方查询页。单号不会自动填入，请粘贴后再查。";
          link.addEventListener("click", async () => {
            const ok = await copyText(row.trackingNumber);
            note.textContent = note.dataset.base + (ok ? " 单号已复制。" : " 没能复制单号，请在打开的页面手动输入。");
          });
          actions.appendChild(link);
        } else {
          note.dataset.base = "暂不能跳转到这家快递的官方查询页。请复制单号后自行查询。";
        }
        note.textContent = note.dataset.base;
        card.append(stamp, title, meta, number, actions, note);
        out.appendChild(card);
      });
    });
  </script>
</body>
</html>
